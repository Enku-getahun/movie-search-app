<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <div id="login-container">
            <div class="login-box">
                <h2 id="auth-title">Welcome Back</h2>
                <p id="auth-subtitle">Access your personal entertainment portal</p>
                <form id="login-form">
                    <input type="text" id="username" placeholder="Username" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <input type="password" id="confirm-password" placeholder="confirm-password" class="hidden
                    ">
                    <button type="submit" id="login-btn">Secure Login</button>
                </form>
                <p id="login-error-msg" class="hidden-msg"></p>
                <p class="toggle-msg">
                   <span id="toggle-text">Don't have an account?</span>
                   <a href="#" id="toggle-auth-link">sign up</a>
                </p>
            </div>
        </div>
    
        <main id="main-app" class="hidden-layout">
            <div class="navbar">
                <button id="logout-btn">Log Out</button>
            </div>
            
            <h1>Movie Search App</h1>
            <p>Search your favorite movies instantly</p>
            
            <div class="search-box-wrapper">
                <input type="text" id="movie-input" placeholder="Search for a movie...">
                <button id="search-btn">Search</button>
            </div>
    
            <div id="movies-grid"></div>
            <div id="netflix-showcase" class="showcase-container">
                <div class="row-section">
                    <h2 class="row-title">Trending Now</h2>
                    <div id="trending-row" class "poster-scroll-row">

                </div>
            </div>
            <div class="row-section">
                <h2 class="row-title">Sci-Fi & Blockbuster</h2>
                <div id="scifi-row" class="poster-scroll-row">
                    
                </div>
            </div>
        </main>
    
        <script src="script.js"></script>
    
   
</body>
</html>
